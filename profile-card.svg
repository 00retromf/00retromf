<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 322" role="img" aria-labelledby="t">
  <title id="t">A Minecraft server console with redacted plugin names and a whois for retromf, 18, United Arab Emirates, studying Computer Engineering with Artificial Intelligence. Below it: Claude enjoyer. Owner at PeanutSMP. A pixel-art Claude mascot bounces over all of it like an old DVD logo.</title>
  <!-- Mascot travel is 768 x 256 at 128 units/s: x turns every 6s, y every 2s, so it lands in a corner every 6s. -->
  <style>
    text { font: 14px ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; fill: #b9b2a5; white-space: pre; }
    .time { fill: #6f685c; }
    .nut { fill: #e0a94e; }
    .ok { fill: #7fbf6a; }
    .hi { fill: #f4efe4; font-weight: 700; }
    .bar { fill: #e0a94e; }
    .big { fill: #f4efe4; font-size: 15px; }
    .l { animation: in .01s linear both; }
    .x { animation: x 6s linear infinite alternate; }
    .y { animation: y 2s linear infinite alternate; }
    .body { fill: #d97757; animation: color 10s steps(1) infinite; }
    .legA { animation: stepA .5s steps(1) infinite; }
    .legB { animation: stepB .5s steps(1) infinite; }
    .eyes { animation: open 4s steps(1) infinite; }
    .lids { animation: shut 4s steps(1) infinite; }
    .corner { fill: #f4efe4; font-size: 22px; font-weight: 700; text-anchor: middle; animation: corner 6s steps(1) infinite; }
    @keyframes in { from { opacity: 0 } to { opacity: 1 } }
    @keyframes x { from { transform: translateX(0) } to { transform: translateX(768px) } }
    @keyframes y { from { transform: translateY(0) } to { transform: translateY(256px) } }
    @keyframes color { 0% { fill: #d97757 } 20% { fill: #e0a94e } 40% { fill: #7fbf6a } 60% { fill: #6fa8dc } 80% { fill: #c586c0 } }
    @keyframes stepA { 0% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes stepB { 0% { transform: translateY(-6px) } 50% { transform: translateY(0) } }
    @keyframes open { 0% { opacity: 1 } 94% { opacity: 0 } }
    @keyframes shut { 0% { opacity: 0 } 94% { opacity: 1 } }
    @keyframes corner { 0% { opacity: 1 } 12% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .l, .x, .y, .body, .legA, .legB, .eyes, .lids { animation: none } .lids { opacity: 0 } .corner { animation: none; opacity: 0 } }
  </style>
  <rect width="858" height="322" rx="8" fill="#1a1712"/>

  <text class="l" x="24" y="30" style="animation-delay:.2s"><tspan class="time">[02:14:09 INFO]:</tspan> Starting PeanutSMP</text>
  <g class="l" style="animation-delay:.8s"><text x="24" y="52" class="time">[02:14:11 INFO]:</text><rect class="bar" x="168" y="40" width="118" height="15"/><text x="298" y="52">enabled</text></g>
  <g class="l" style="animation-delay:1.1s"><text x="24" y="74" class="time">[02:14:11 INFO]:</text><rect class="bar" x="168" y="62" width="84" height="15"/><text x="264" y="74">enabled</text></g>
  <g class="l" style="animation-delay:1.4s"><text x="24" y="96" class="time">[02:14:12 INFO]:</text><rect class="bar" x="168" y="84" width="142" height="15"/><text x="322" y="96">enabled</text></g>
  <text class="l ok" x="24" y="118" style="animation-delay:2s">[02:14:12 INFO]: Done! Plugin list is classified.</text>
  <text class="l hi" x="24" y="150" style="animation-delay:2.8s">&gt; whois retromf</text>
  <text class="l" x="24" y="172" style="animation-delay:3.3s"><tspan class="nut">name   </tspan> retromf, 18, United Arab Emirates</text>
  <text class="l" x="24" y="194" style="animation-delay:3.5s"><tspan class="nut">studying</tspan> Computer Engineering with Artificial Intelligence</text>

  <rect x="24" y="214" width="810" height="1" fill="#3a3429"/>
  <text class="big" x="24" y="244">I'm 18, studying Computer Engineering with Artificial Intelligence.</text>
  <text class="big" x="24" y="270">Claude enjoyer.</text>
  <text class="big" x="24" y="296">Owner @ PeanutSMP</text>

  <text class="corner" x="640" y="120">CORNER!</text>

  <g class="x"><g class="y" shape-rendering="crispEdges">
    <g class="body">
      <!-- legs sit behind the body and step up into it -->
      <rect class="legA" x="18" y="48" width="6" height="18"/>
      <rect class="legB" x="30" y="48" width="6" height="18"/>
      <rect class="legA" x="54" y="48" width="6" height="18"/>
      <rect class="legB" x="66" y="48" width="6" height="18"/>
      <!-- body with notched corners -->
      <rect x="24" y="0" width="42" height="6"/>
      <rect x="18" y="6" width="54" height="42"/>
      <!-- claws -->
      <rect x="6" y="18" width="12" height="12"/>
      <rect x="0" y="12" width="6" height="12"/>
      <rect x="72" y="18" width="12" height="12"/>
      <rect x="84" y="12" width="6" height="12"/>
    </g>
    <!-- shading works on every bounce color -->
    <rect x="24" y="6" width="42" height="6" fill="#ffffff" opacity=".22"/>
    <rect x="18" y="42" width="54" height="6" fill="#000000" opacity=".2"/>
    <rect x="24" y="30" width="6" height="6" fill="#ffffff" opacity=".3"/>
    <rect x="60" y="30" width="6" height="6" fill="#ffffff" opacity=".3"/>
    <rect x="39" y="33" width="12" height="3" fill="#1a1712"/>
    <g class="eyes">
      <rect x="30" y="15" width="6" height="12" fill="#1a1712"/>
      <rect x="54" y="15" width="6" height="12" fill="#1a1712"/>
      <rect x="30" y="15" width="3" height="3" fill="#ffffff"/>
      <rect x="54" y="15" width="3" height="3" fill="#ffffff"/>
    </g>
    <g class="lids">
      <rect x="27" y="21" width="12" height="3" fill="#1a1712"/>
      <rect x="51" y="21" width="12" height="3" fill="#1a1712"/>
    </g>
  </g></g>
</svg>
